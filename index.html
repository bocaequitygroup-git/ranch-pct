<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngapori — Production Control Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c1310;
    --bg-raise: #121b17;
    --panel: #16211c;
    --panel-2: #1c2921;
    --line: #2a3a32;
    --line-soft: #202f28;
    --text: #e8ede6;
    --text-dim: #a8b8ac;
    --text-faint: #6d8177;
    --green: #6fbf6a;
    --green-deep: #3f7a45;
    --amber: #e0a83c;
    --amber-deep: #8a6320;
    --red: #e2583e;
    --red-deep: #7a2e20;
    --blue: #56a8c9;
    --blue-deep: #285566;
    --gold: #d0a23e;
    --radius: 3px;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'Space Grotesk', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  body::before{
    content:"";
    position: fixed; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events:none;
    z-index:0;
  }
  #app{position:relative; z-index:1; max-width:1320px; margin:0 auto; padding: 18px 20px 60px;}

  /* ---------- HEADER ---------- */
  .topbar{
    display:flex; align-items:flex-end; justify-content:space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
    margin-bottom: 16px;
    gap: 20px;
    flex-wrap: wrap;
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand .tag{
    font-family: var(--mono); font-size:10.5px; letter-spacing:.14em; color: var(--text-faint);
  }
  .brand h1{
    margin:0; font-size:22px; font-weight:700; letter-spacing:-0.01em;
    color: var(--text);
  }
  .brand h1 span{color: var(--green);}
  .header-controls{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .asof-box{
    display:flex; align-items:center; gap:8px;
    background: var(--panel); border:1px solid var(--line); border-radius: var(--radius);
    padding: 7px 10px;
  }
  .asof-box label{font-size:10.5px; color:var(--text-faint); font-family:var(--mono); letter-spacing:.08em;}
  .asof-box input[type=date]{
    background: transparent; border:none; color: var(--text); font-family: var(--mono);
    font-size: 13px; outline:none;
  }
  .btn{
    background: var(--panel-2); border:1px solid var(--line); color: var(--text-dim);
    font-family: var(--mono); font-size: 11.5px; letter-spacing:.03em;
    padding: 7px 11px; border-radius: var(--radius); cursor:pointer;
    transition: border-color .12s, color .12s, background .12s;
  }
  .btn:hover{ border-color: var(--green-deep); color: var(--text); }
  .btn.primary{ border-color: var(--green-deep); color: var(--green); }
  .btn.primary:hover{ background: rgba(111,191,106,0.08); }

  /* ---------- NAV ---------- */
  .nav{
    display:flex; gap: 2px; margin-bottom: 20px; border-bottom:1px solid var(--line);
  }
  .nav button{
    background:none; border:none; color: var(--text-faint); font-family: var(--sans);
    font-size: 13.5px; font-weight:600; padding: 10px 16px; cursor:pointer;
    border-bottom: 2px solid transparent; letter-spacing:.01em;
  }
  .nav button:hover{ color: var(--text-dim); }
  .nav button.active{ color: var(--text); border-bottom-color: var(--green); }
  .nav .count{ color: var(--text-faint); font-family:var(--mono); font-size:11px; margin-left:4px;}
  .nav button.active .count{ color: var(--green); }

  .view{ display:none; }
  .view.active{ display:block; }

  /* ---------- KPI BAR ---------- */
  .kpi-grid{
    display:grid; grid-template-columns: repeat(6, 1fr); gap:1px;
    background: var(--line); border:1px solid var(--line); border-radius: var(--radius);
    overflow:hidden; margin-bottom: 20px;
  }
  @media (max-width: 1100px){ .kpi-grid{ grid-template-columns: repeat(3, 1fr);} }
  .kpi{
    background: var(--panel); padding: 12px 12px; cursor:pointer;
    transition: background .12s;
  }
  .kpi:hover{ background: var(--panel-2); }
  .kpi .n{ font-family: var(--mono); font-size: 22px; font-weight:700; color: var(--text); line-height:1; }
  .kpi .l{ font-size: 10.5px; color: var(--text-faint); margin-top:6px; letter-spacing:.02em; }
  .kpi.warn .n{ color: var(--amber); }
  .kpi.alert .n{ color: var(--red); }
  .kpi.good .n{ color: var(--green); }
  .kpi.info .n{ color: var(--blue); }

  /* ---------- KPI GROUPS / RECON / EXCEPTIONS ---------- */
  .kpi-groups{ margin-bottom: 20px; }
  .kpi-group{ margin-bottom: 12px; }
  .kpi-group-label{ font-size:11.5px; font-weight:600; color: var(--text-dim); margin: 0 2px 6px; }
  .kpi-group .kpi-grid{ grid-template-columns: repeat(var(--cols,4), 1fr); margin-bottom:0; }
  @media (max-width: 1100px){ .kpi-group .kpi-grid{ grid-template-columns: repeat(3, 1fr);} }
  .recon{
    font-size:12.5px; line-height:1.7; color: var(--text-dim);
    background: var(--panel); border:1px solid var(--line); border-radius: var(--radius);
    padding: 10px 14px; margin: 0 0 14px;
  }
  .recon b{ color: var(--text); }
  .recon .recon-link{ cursor:pointer; border-bottom:1px dotted var(--text-faint); }
  .recon .recon-link:hover{ color: var(--text); }
  .recon .ok{ color: var(--green); }
  .recon .bad{ color: var(--red); }
  .recon .amb{ color: var(--amber); }
  .prod-sub{ display:block; font-size:10.5px; color: var(--text-faint); font-family: var(--sans); }
  .prod-flag{ color: var(--amber); cursor: help; }
  .exc-wrap{ overflow-x:auto; }
  .exc-table td.exc{ color: var(--red); font-family: var(--mono); font-size:11.5px; white-space:nowrap; }
  .alert-section-sub{ font-size:11.5px; color: var(--text-faint); margin: -2px 0 8px; }

  /* ---------- PANELS ---------- */
  .panel{
    background: var(--panel); border:1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 18px;
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;
  }
  .panel-head h2{ margin:0; font-size:14.5px; font-weight:700; color: var(--text); letter-spacing:.01em;}
  .panel-head .sub{ font-family: var(--mono); font-size:10.5px; color:var(--text-faint); }

  .today-grid{
    display:grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
  }
  @media (max-width: 1000px){ .today-grid{ grid-template-columns: repeat(2,1fr);} }
  .today-card{
    border:1px solid var(--line-soft); border-radius: var(--radius); padding: 12px;
    background: var(--bg-raise);
  }
  .today-card .icon{ font-size:18px; margin-bottom:6px; display:block;}
  .today-card .count{ font-family: var(--mono); font-size: 20px; font-weight:700; }
  .today-card .label{ font-size: 11px; color: var(--text-faint); margin-top:2px;}
  .today-card .items{ margin-top:8px; display:flex; flex-direction:column; gap:4px;}
  .today-card .item{
    font-family: var(--mono); font-size:11px; color: var(--text-dim); cursor:pointer;
    padding:3px 6px; border-radius:2px; background: var(--panel-2);
  }
  .today-card .item:hover{ color:var(--text); background: var(--panel);}
  .today-card .item small{ color: var(--text-faint); }

  table{ width:100%; border-collapse: collapse; font-size:12.5px;}
  th{
    text-align:left; font-family: var(--mono); font-size:10.5px; letter-spacing:.05em;
    color: var(--text-faint); font-weight:600; padding: 6px 10px; border-bottom:1px solid var(--line);
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  th:hover{ color: var(--text-dim); }
  td{ padding: 7px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
  tr.rowlink{ cursor:pointer; }
  tr.rowlink:hover td{ background: var(--panel-2); }
  td.mono, .mono{ font-family: var(--mono); }

  .badge{
    display:inline-block; font-family: var(--mono); font-size: 10px; padding: 2px 6px;
    border-radius: 2px; letter-spacing:.03em; border:1px solid transparent;
  }
  .badge.stage-planned{ color: var(--text-faint); border-color: var(--line); }
  .badge.stage-ghprop{ color: var(--blue); border-color: var(--blue-deep); background: rgba(86,168,201,0.08);}
  .badge.stage-growing{ color: var(--green); border-color: var(--green-deep); background: rgba(111,191,106,0.08);}
  .badge.stage-harvesting{ color: var(--gold); border-color: var(--amber-deep); background: rgba(208,162,62,0.12);}
  .badge.stage-complete{ color: var(--text-faint); border-color:var(--line); }
  .badge.win-in{ color: var(--green); }
  .badge.win-out{ color: var(--red); }
  .badge.win-none{ color: var(--text-faint); }
  .badge.method-ghprop{ color: var(--blue); border-color: var(--blue-deep); }
  .badge.method-direct{ color: var(--green); border-color: var(--green-deep); }
  .badge.method-other{ color: var(--text-dim); border-color: var(--line); }

  /* ---------- CALENDAR ---------- */
  .cal-toolbar{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;
  }
  .cal-nav{ display:flex; align-items:center; gap:10px; }
  .cal-nav .month-label{ font-family: var(--mono); font-size:15px; font-weight:600; min-width:190px; text-align:center;}
  .cal-filters{ display:flex; gap:14px; flex-wrap:wrap; }
  .cal-filters label{
    display:flex; align-items:center; gap:6px; font-family: var(--mono); font-size:11px; color: var(--text-dim); cursor:pointer;
  }
  .cal-filters input{ accent-color: var(--green); }
  .cal-grid{
    display:grid; grid-template-columns: repeat(7, 1fr); gap:1px;
    background: var(--line); border:1px solid var(--line); border-radius: var(--radius); overflow:hidden;
  }
  .cal-dow{
    background: var(--bg-raise); padding:7px 8px; font-family: var(--mono); font-size:10px;
    letter-spacing:.08em; color: var(--text-faint); text-align:center;
  }
  .cal-cell{
    background: var(--panel); min-height: 96px; padding:6px; display:flex; flex-direction:column; gap:3px;
  }
  .cal-cell.other-month{ background: var(--bg-raise); opacity:.45; }
  .cal-cell.today{ box-shadow: inset 0 0 0 1px var(--amber); }
  .cal-daynum{ font-family: var(--mono); font-size:11px; color: var(--text-faint); text-align:right; }
  .cal-cell.today .cal-daynum{ color: var(--amber); font-weight:700; }
  .cal-event{
    font-size:10.5px; font-family: var(--mono); padding: 2px 4px; border-radius:2px; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    border-left: 2px solid var(--line);
  }
  .cal-event:hover{ filter: brightness(1.3); }
  .cal-event.plant.ghprop{ border-left-color: var(--blue); background: rgba(86,168,201,0.10); color:#bfe3f2;}
  .cal-event.plant.direct{ border-left-color: var(--green); background: rgba(111,191,106,0.10); color:#c9ecc6;}
  .cal-event.transplant{ border-left-color: var(--amber); background: rgba(224,168,60,0.10); color:#f2dca9;}
  .cal-event.harvest{ border-left-color: var(--gold); background: rgba(208,162,62,0.14); color:#f2dfa9;}
  .cal-more{ font-family: var(--mono); font-size:10px; color: var(--text-faint); padding-left:4px; }

  /* ---------- CROPS LIST ---------- */
  .crops-toolbar{ display:flex; gap:10px; margin-bottom:14px; align-items:center; flex-wrap:wrap;}
  .search{
    background: var(--bg-raise); border:1px solid var(--line); border-radius: var(--radius);
    padding: 8px 10px; color: var(--text); font-family: var(--mono); font-size:12.5px; flex:1; min-width:220px;
  }
  .group-block{ margin-bottom: 18px; }
  .group-title{
    font-family: var(--mono); font-size:11px; letter-spacing:.1em; color: var(--text-faint);
    padding: 6px 2px; border-bottom: 1px solid var(--line-soft); margin-bottom:6px;
  }
  .crop-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
  @media (max-width:1000px){ .crop-grid{ grid-template-columns: repeat(2,1fr);} }
  @media (max-width:640px){ .crop-grid{ grid-template-columns: 1fr;} }
  .crop-card{
    border:1px solid var(--line-soft); background: var(--bg-raise); border-radius: var(--radius);
    padding: 11px 12px; cursor:pointer; transition: border-color .12s;
  }
  .crop-card:hover{ border-color: var(--green-deep); }
  .crop-card .name{ font-weight:600; font-size:13.5px; }
  .crop-card .meta{ display:flex; gap:8px; margin-top:6px; align-items:center; flex-wrap:wrap; }
  .crop-card .waves{ font-family: var(--mono); font-size:11px; color: var(--text-faint); margin-top:6px; }

  /* ---------- CROP DETAIL ---------- */
  .crop-summary-grid{
    display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom:16px;
  }
  @media (max-width:900px){ .crop-summary-grid{ grid-template-columns: repeat(2,1fr);} }
  .sumbox{ border:1px solid var(--line-soft); border-radius: var(--radius); padding:10px 12px; background: var(--bg-raise);}
  .sumbox .k{ font-family: var(--mono); font-size:10px; color: var(--text-faint); letter-spacing:.05em;}
  .sumbox .v{ font-size:15px; font-weight:600; margin-top:4px; }

  .timeline-row{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .timeline-label{ font-family: var(--mono); font-size:11px; width:64px; flex-shrink:0; color:var(--text-dim); }
  .timeline-track{ position:relative; flex:1; height:16px; background: var(--bg-raise); border-radius:2px; }
  .timeline-bar{ position:absolute; top:2px; bottom:2px; border-radius:2px; }
  .timeline-bar.gh{ background: rgba(86,168,201,0.4); border:1px solid var(--blue); }
  .timeline-bar.field{ background: rgba(111,191,106,0.4); border:1px solid var(--green); }
  .timeline-dot{ position:absolute; top:-3px; width:8px; height:8px; border-radius:50%; background: var(--gold); border:1px solid #0c1310; }

  /* ---------- ALERTS ---------- */
  .alert-group{ margin-bottom: 18px; }
  .alert-group h3{
    font-size:12.5px; font-family: var(--mono); letter-spacing:.04em; margin: 0 0 10px;
    display:flex; align-items:center; gap:8px;
  }
  .alert-list{ display:flex; flex-direction:column; gap:8px; }
  .alert-item{
    border:1px solid var(--line-soft); border-left-width:3px; border-radius:2px;
    padding: 10px 12px; background: var(--bg-raise); cursor:pointer;
  }
  .alert-item.critical{ border-left-color: var(--red); }
  .alert-item.warning{ border-left-color: var(--amber); }
  .alert-item.info{ border-left-color: var(--blue); }
  .alert-item .title{ font-weight:600; font-size:13px; }
  .alert-item .detail{ font-size:11.5px; color: var(--text-faint); margin-top:3px; font-family: var(--mono);}

  /* ---------- MODAL ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background: rgba(5,8,6,0.72); display:none;
    align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background: var(--panel); border:1px solid var(--line); border-radius: 4px;
    max-width: 640px; width:100%; max-height:86vh; overflow-y:auto;
    padding: 22px 24px;
  }
  .modal-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .modal-head h2{ margin:0; font-size:19px; }
  .modal-head .x{ cursor:pointer; color: var(--text-faint); font-size:20px; line-height:1; padding:2px 6px;}
  .modal-head .x:hover{ color: var(--text); }
  .modal-sub{ color: var(--text-faint); font-family: var(--mono); font-size:11.5px; margin-bottom:16px;}
  .modal-fields{ display:grid; grid-template-columns: repeat(2,1fr); gap:10px 18px; margin-bottom:18px;}
  .field .k{ font-family: var(--mono); font-size:10px; color: var(--text-faint); letter-spacing:.05em;}
  .field .v{ font-size:14px; margin-top:3px; font-weight:600; }
  .milestone-table{ margin-top:6px; }
  .milestone-table td:first-child{ color: var(--text-dim); }
  .milestone-table td:last-child{ font-family: var(--mono); text-align:right; font-weight:600; }
  .note{ font-size:11.5px; color: var(--text-faint); margin-top:14px; border-top:1px solid var(--line-soft); padding-top:12px; }

  /* ---------- CROP PROFILE SECTIONS (inside cohort modal) ---------- */
  .profile-section{ margin-bottom:18px; }
  .profile-section .sec-title{
    font-family: var(--mono); font-size:10px; letter-spacing:.1em; color: var(--text-faint);
    padding-bottom:6px; margin-bottom:10px; border-bottom:1px solid var(--line-soft);
  }
  .wave-table{ width:100%; border-collapse:collapse; font-size:11.5px; margin-top:4px; }
  .wave-table th{
    text-align:left; font-family: var(--mono); font-size:9.5px; letter-spacing:.04em;
    color: var(--text-faint); font-weight:600; padding:5px 8px; border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  .wave-table td{ padding:5px 8px; border-bottom:1px solid var(--line-soft); font-family: var(--mono); white-space:nowrap; }
  .wave-table tr.current-wave td{ background: rgba(111,191,106,0.10); color: var(--text); font-weight:600; }
  .wave-table tr.current-wave td:first-child{ border-left:2px solid var(--green); }

  .empty{ padding: 30px; text-align:center; color: var(--text-faint); font-family: var(--mono); font-size:12px;}
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:5px; }
  ::-webkit-scrollbar-track{ background: transparent; }

  /* ---------- LIVE DATA / SYNC UI ---------- */
  #loadingOverlay{
    position:fixed; inset:0; z-index:200; background: var(--bg);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
  }
  #loadingOverlay .spin{
    width:22px; height:22px; border-radius:50%;
    border: 2px solid var(--line); border-top-color: var(--green);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  #loadingOverlay .msg{ font-family: var(--mono); font-size:12px; color: var(--text-faint); letter-spacing:.05em; }
  #errorBanner{
    display:none; background: var(--red-deep); border:1px solid var(--red); color:#ffe9e4;
    border-radius: var(--radius); padding:10px 14px; margin-bottom:14px;
    font-family: var(--mono); font-size:12px; align-items:center; justify-content:space-between; gap:12px;
  }
  #errorBanner.show{ display:flex; }
  #errorBanner button{
    background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25); color:#fff;
    font-family: var(--mono); font-size:11px; padding:5px 10px; border-radius: var(--radius); cursor:pointer; flex-shrink:0;
  }
  .sync-box{ display:flex; align-items:center; gap:8px; font-family: var(--mono); font-size:10.5px; color: var(--text-faint); }
  .sync-box .dot{ width:6px; height:6px; border-radius:50%; background: var(--green); flex-shrink:0; }
  .sync-box.stale .dot{ background: var(--amber); }
  #syncBtn.syncing{ opacity:.6; pointer-events:none; }

  /* ---------- DOB EDITOR (inside cohort modal) ---------- */
  .dob-editor{
    margin-top: 4px; margin-bottom: 18px; padding: 12px 14px;
    background: var(--panel-2); border:1px solid var(--line); border-radius: var(--radius);
  }
  .dob-editor .lbl{ font-family: var(--mono); font-size:10.5px; letter-spacing:.08em; color: var(--text-faint); margin-bottom:8px; }
  .dob-editor .row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .dob-editor input[type=date]{
    background: var(--bg-raise); border:1px solid var(--line); color: var(--text); font-family: var(--mono);
    font-size: 13px; padding:6px 8px; border-radius: var(--radius); outline:none;
  }
  .dob-editor .save-btn{
    background: var(--green-deep); border:1px solid var(--green); color:#eafcea;
    font-family: var(--mono); font-size:11.5px; padding:6px 12px; border-radius: var(--radius); cursor:pointer;
  }
  .dob-editor .save-btn:disabled{ opacity:.5; cursor:default; }
  .dob-editor .clear-btn{
    background: transparent; border:1px solid var(--line); color: var(--text-dim);
    font-family: var(--mono); font-size:11.5px; padding:6px 12px; border-radius: var(--radius); cursor:pointer;
  }
  .dob-editor .status{ font-family: var(--mono); font-size:11px; margin-left:4px; }
  .dob-editor .status.ok{ color: var(--green); }
  .dob-editor .status.err{ color: var(--red); }
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spin"></div>
  <div class="msg" id="loadingMsg">CONNECTING TO GOOGLE SHEET…</div>
</div>

<script>
// ============ LIVE BACKEND CONFIG ============
// Rewired 2026-09-18: this used to be its own separate Apps Script
// deployment (a "DOB Engine" workbook with its own GET-based /exec
// contract). It now reads from Ranch_Vegetable_VPOS_MASTER_v2026 through
// the SAME Code_main.gs deployment workerapp.html/manager_dashboard.html
// use -- see ControlTowerAPI.gs for the tab mapping and get-control-tower-data
// / update-control-tower-dob for the two actions this file calls.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwUFXoHDFSUArQCIqkh2De8-fwPfWSG9LRvtagJPzmJdFaBx_95av5V57NzYs1J1IZLnA/exec';

// POST only, matching Code_main.gs's doPost -- it has no doGet query-action
// router. Content-Type is deliberately text/plain so the browser treats this
// as a CORS "simple request" (no preflight OPTIONS) -- Apps Script web apps
// don't handle OPTIONS, so application/json here would break cross-origin
// calls. The backend still parses the body as JSON. Response envelope is
// {success, error, ...named fields} (not {ok, data}), so callers read
// fields directly off the resolved object rather than off a nested .data.
async function api(action, payload) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, payload: payload || {} })
  });
  if (!res.ok) throw new Error('Network error (' + res.status + ') calling ' + action);
  const json = await res.json();
  if (!json.success) throw new Error(json.error || ('Request failed: ' + action));
  return json;
}

// ============ DATA (loaded live from the Google Sheet — see boot()) ============
let SOURCE = null;
let COHORTS = [];
let CROPS = [];
let cohortByKey = {};
let cropById = {};

function indexData(){
  COHORTS.forEach(c => c.key = c.crop_id + '-' + c.wave);
  cohortByKey = Object.fromEntries(COHORTS.map(c => [c.key, c]));
  cropById = Object.fromEntries(CROPS.map(c => [c.crop_id, c]));
}

// GH-PROP is NOT a method: it is a per-cohort Facility_Phase (propagation / prep
// for a field transplant). A crop's method is how it is actually planted.
const METHOD_LABEL = {
  'DIRECT': 'Direct Sow', 'TRANSPLANT': 'Transplant', 'SLIP': 'Slip Planting',
  'CUTTING': 'Cutting Planting', 'CROWN': 'Crown Planting', 'SUCKER': 'Sucker Planting',
  'SETT': 'Sett Planting'
};
let SUMMARY = null; // backend window-evaluation totals (see ControlTowerAPI.gs ctBuildDataset_)

// ============ DATE HELPERS ============
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function pd(iso){ if(!iso) return null; const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(iso, n){ const d = pd(iso); d.setDate(d.getDate()+n); return toISO(d); }
function daysBetween(a,b){ return Math.round((pd(b)-pd(a))/86400000); }
// Every DOB / Harvest Ready date is shown WITH its year (fmtShortY / fmtLong) -- cohorts
// repeat on the same month/day across years, so a yearless date is ambiguous.
// fmtWindowDate is ONLY for planting-window boundaries ('MM-DD'), which recur every year.
function fmtWindowDate(md){ if(!md) return '—'; const [m,d] = md.split('-').map(Number); return MONTHS[m-1].slice(0,3)+' '+d; }
function fmtWindowSegments(segs){ return (segs && segs.length) ? segs.map(g => fmtWindowDate(g.start)+' – '+fmtWindowDate(g.end)).join('  ·  ') : '—'; }
function fmtShortY(iso){ if(!iso) return '—'; const d = pd(iso); return MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate()+', '+d.getFullYear(); }
function fmtLong(iso){ if(!iso) return '—'; const d = pd(iso); return MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); }
function todayISO(){ return toISO(new Date()); }

// season start = earliest DOB in dataset (recomputed each time data loads/refreshes)
let SEASON_START = todayISO();

// ============ STATE ============
const state = {
  tab: 'dashboard',
  asOf: SEASON_START,
  calYear: pd(SEASON_START).getFullYear(),
  calMonth: pd(SEASON_START).getMonth(),
  filters: { plant: true, transplant: true, harvest: true },
  cropSearch: '',
  sortCol: 'dob', sortDir: 1,
  horizon: 30,          // days ahead of the viewing date that 'planned' waves stay in the current pipeline (null = all)
};

// ============ STAGE LOGIC ============
// harvest window length depends on pattern
function harvestWindowDays(pattern){
  if(pattern === 'Continuous') return 21;
  if(pattern === 'Storage') return 10;
  if(pattern === 'Perennial') return 60;
  if(pattern === 'Cover') return 14;
  return 14;
}

// Harvest length actually used for a cohort: the crop's Harvest_Window_Days
// from CROP_PRODUCTION_MASTER when present, else the pattern default.
function harvestWindowFor(c){
  return (typeof c.harvest_window_days === 'number' && c.harvest_window_days >= 0) ? c.harvest_window_days : harvestWindowDays(c.pattern);
}
// The end of harvest used by EVERY status, count and column. The sheet's own Harvest_End_Date wins
// (COHORT_PRODUCTION); only when it is blank do we fall back to First_Harvest_Date + the crop's window.
function harvestEndFor(c){
  if(c.harvest_end) return c.harvest_end;
  return c.harvest_ready ? addDays(c.harvest_ready, harvestWindowFor(c)) : null;
}
function harvestWindowIsDefault(c){
  return !(typeof c.harvest_window_days === 'number' && c.harvest_window_days >= 0);
}

function getStage(c, asOf){
  if(!c.dob) return 'no-schedule';
  // COHORT_PRODUCTION rows are proposed waves, not live plantings -- a wave
  // only becomes a real planting once dispatched into COHORT_MASTER (see
  // ControlTowerAPI.gs header). So for VPOS-sourced cohorts (anything
  // carrying pipeline_status), the real Pipeline_Status governs the stage
  // shown, regardless of where the viewing date falls relative to the
  // proposed DOB: PLANNED always reads as "planned", never "growing" just
  // because its date has passed on the calendar. CURRENT_STARTUP is the
  // one status VPOS uses for a wave that's actually already underway, so
  // it falls through to the normal date-based math below.
  if(c.pipeline_status === 'PLANNED') return 'planned';
  // DOB is the planting date for every method (GH-PROP transplant or direct
  // seed alike) — GH-PROP's own nursery schedule runs before DOB but is a
  // separate track and doesn't get a stage on the planting calendar.
  if(asOf < c.dob) return 'planned';
  if(!c.harvest_ready) return 'growing';
  if(asOf < c.harvest_ready) return 'growing';
  // real per-crop harvest length from CROP_PRODUCTION_MASTER; pattern default only if absent
  const hEnd = harvestEndFor(c);
  if(asOf <= hEnd) return 'harvesting';
  return 'complete';
}
const STAGE_LABEL = { 'planned':'Planned','growing':'Growing','harvesting':'Harvesting','complete':'Complete','no-schedule':'Unscheduled' };

// ============ EVENTS (flattened for calendar) ============
function buildEvents(){
  const events = [];
  COHORTS.forEach(c => {
    if(!c.dob || !isFieldCohort(c)) return; // dataset boundary: field-only calendar
    // DOB is the planting date for every method — GH-PROP's transplant IS
    // this event, not a separate later one, so there's only ever one plant
    // event per cohort on the calendar.
    events.push({ date: c.dob, type:'plant', sub: c.in_gh_prop?'ghprop':'direct', cohort: c });
    if(c.harvest_ready){
      events.push({ date: c.harvest_ready, type:'harvest', sub:'', cohort: c });
    }
  });
  return events;
}
let EVENTS = [];
let eventsByDate = {};
function indexEvents(){
  EVENTS = buildEvents();
  eventsByDate = {};
  EVENTS.forEach(e => { (eventsByDate[e.date] = eventsByDate[e.date] || []).push(e); });
}

// ============ KPI COMPUTATION ============
// A wave whose planting date is already behind the viewing date but whose Pipeline_Status is still PLANNED
// (never dispatched/confirmed). getStage() deliberately keeps these as 'planned'; this surfaces them.
function startOverdue(c, asOf){ return !!c.dob && c.pipeline_status === 'PLANNED' && c.dob < asOf; }

function computeKPIs(asOf){
  const scheduled = COHORTS.filter(c=>c.dob && isFieldCohort(c)); // dataset boundary: field-only
  const startsOverdue = scheduled.filter(c => startOverdue(c, asOf)).length;
  const activeCrops = new Set(scheduled.map(c=>c.crop_id)).size;
  // Phase split (per cohort), FIELD dataset only: direct-field + field-via-GH-PROP = every
  // scheduled wave on THIS dashboard. GH-FULL / GH-PROP-into-greenhouse never appear in
  // `scheduled` at all (dataset boundary) -- greenhouseWaves below is informational only,
  // computed from the full COHORTS set, and is not part of any field total.
  const fieldCohorts = scheduled.filter(c=>prodPhase(c)==='FIELD' && !propPath(c)).length;
  const ghCohorts = scheduled.filter(c=>prodPhase(c)==='FIELD' && propPath(c)).length;
  const greenhouseWaves = COHORTS.filter(c => c.dob && !isFieldCohort(c)).length;
  const harvestingNow = scheduled.filter(c => getStage(c, asOf)==='harvesting').length;
  const ready7 = scheduled.filter(c => c.harvest_ready && c.harvest_ready > asOf && daysBetween(asOf,c.harvest_ready) <= 7).length;
  const ready14 = scheduled.filter(c => c.harvest_ready && daysBetween(asOf,c.harvest_ready) > 7 && daysBetween(asOf,c.harvest_ready) <= 14).length;
  // Two DIFFERENT numbers: waves outside their window vs. crops needing attention
  const outsideWaves = scheduled.filter(c => c.window_check === 'OUTSIDE WINDOW');
  const outsideWindow = outsideWaves.length;
  const outsideCrops = new Set(outsideWaves.map(c=>c.crop_id)).size;
  const recon = windowRecon(scheduled);
  const facilityChecks = scheduled.filter(c => prodAnomaly(c)).length;
  const noWaves = CROPS.filter(c => c.valid_waves === 0).length;
  const al = computeAlerts();
  const alertCrops = alertCropIds(al).length;
  const missingWindow = CROPS.filter(c => c.window_kind==='NONE' || c.window_kind==='UNPARSEABLE').length;
  return { activeCrops, totalCohorts: scheduled.length, fieldCohorts, ghCohorts, greenhouseWaves, harvestingNow, ready7, ready14,
           outsideWindow, outsideCrops, recon, facilityChecks, noWaves, startsOverdue, alertCrops, missingWindow };
}

// ============ RENDER: TOP CONTROLS ============
function initHeader(){
  const input = document.getElementById('asOfInput');
  input.value = state.asOf;
  input.addEventListener('change', () => { state.asOf = input.value; renderAll(); });
  document.getElementById('jumpSeasonBtn').addEventListener('click', () => { state.asOf = SEASON_START; input.value = state.asOf; renderAll(); });
  document.getElementById('jumpTodayBtn').addEventListener('click', () => { state.asOf = todayISO(); input.value = state.asOf; renderAll(); });
  document.getElementById('syncBtn').addEventListener('click', () => refreshData());
  document.getElementById('errorRetryBtn').addEventListener('click', () => boot());

  document.querySelectorAll('#mainNav button').forEach(btn => {
    btn.addEventListener('click', () => {
      state.tab = btn.dataset.tab;
      document.querySelectorAll('#mainNav button').forEach(b=>b.classList.toggle('active', b===btn));
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      document.getElementById('view-'+state.tab).classList.add('active');
      renderAll();
    });
  });
}

// ============ DASHBOARD ============
function renderDashboard(){
  const el = document.getElementById('view-dashboard');
  const k = computeKPIs(state.asOf);
  const alerts = computeAlerts();

  el.innerHTML = `
    <div class="kpi-groups">
      ${kpiGroup('Field Production \u2014 every wave is counted once: field direct + field via GH-PROP. Greenhouse (GH-FULL) is out of scope for this dashboard.', 4, [
        kpiCell(k.activeCrops,'Crops Scheduled','','activeCrops','of '+CROPS.length+' in crop master'),
        kpiCell(k.totalCohorts,'Scheduled Waves','','totalCohorts','all planting years, field only'),
        kpiCell(k.fieldCohorts,'Field Production \u00b7 Direct','','fieldCohorts','sown directly in a field block'),
        kpiCell(k.ghCohorts,'Field Production \u00b7 via GH-PROP','info','ghCohorts','propagated in greenhouse, transplanted to a field block')
      ])}
      ${kpiGroup('Harvest', 3, [
        kpiCell(k.harvestingNow,'Harvesting Now','good','harvestingNow','first harvest \u2264 today \u2264 harvest end'),
        kpiCell(k.ready7,'Harvest Ready \u2264 7 Days','warn','ready7','first harvest date within 7 days'),
        kpiCell(k.ready14,'Harvest Ready 8\u201314 Days','','ready14','first harvest date in 8\u201314 days')
      ])}
      ${kpiGroup('Control', 5, [
        kpiCell(k.outsideWindow,'Waves Outside Window','alert','outsideWindow','in '+k.outsideCrops+' crop'+(k.outsideCrops===1?'':'s')),
        kpiCell(k.startsOverdue,'Planned \u00b7 Start Date Passed','warn','startsOverdue','still PLANNED, not dispatched'),
        kpiCell(k.alertCrops,'Alert Crops','warn','alertCrops','crops needing attention'),
        kpiCell(k.noWaves,'Crops Without Scheduled Waves','warn','noWaves','no COHORT_PRODUCTION row'),
        kpiCell(k.missingWindow,'Crops Missing Window Data','warn','missingWindow')
      ])}
    </div>
    ${reconHTML(k)}
    ${sourceLineHTML()}

    <div class="panel">
      <div class="panel-head">
        <h2>TODAY — ${fmtLong(state.asOf).toUpperCase()}</h2>
        <span class="sub">operational snapshot for the viewing date above</span>
      </div>
      <div class="today-grid" id="todayGrid"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>CURRENT PRODUCTION PIPELINE</h2>
        <span class="sub" id="pipelineSub"></span>
        <span class="sub">upcoming starts within
          <select id="horizonSel" style="background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:3px;font-family:var(--mono);font-size:11px;padding:2px 4px;">
            ${[[14,'14 days'],[30,'30 days'],[60,'60 days'],[90,'90 days'],['all','all waves']].map(([v,l]) => `<option value="${v}" ${(state.horizon===null?'all':state.horizon)==v?'selected':''}>${l}</option>`).join('')}
          </select></span>
      </div>
      <div id="pipelineTableWrap"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>ALERTS SUMMARY</h2>
        <span class="sub">${alertCropIds(alerts).length} crops with alerts \u00b7 ${k.outsideWindow} waves outside window (in ${k.outsideCrops} crops) \u00b7 ${k.noWaves} crops without scheduled waves</span>
      </div>
      <div class="alert-list" id="dashAlertPreview"></div>
    </div>
  `;
  renderTodayPanel();
  renderPipelineTable();
  document.getElementById('horizonSel').addEventListener('change', e => { state.horizon = e.target.value === 'all' ? null : Number(e.target.value); renderPipelineTable(); });
  renderDashboardAlertPreview(alerts);
  document.querySelectorAll('.kpi-grid').forEach(g => el_delegate(g, '.kpi', el => openKpiModal(el.dataset.kpi)));
  el_delegate(document.getElementById('view-dashboard'), '.recon-link', el => openKpiModal(el.dataset.kpi));
}

function sourceLineHTML(){
  if(!SOURCE) return '';
  const fmt = o => Object.keys(o||{}).sort().map(k => k+': '+o[k]).join(' · ');
  return `<div style="font-size:12px;opacity:.75;margin:-4px 2px 14px;line-height:1.6;">
    <b>Source</b> ${SOURCE.workbook_name} \u2192 COHORT_PRODUCTION rows with a plantable date = <b>${SOURCE.cohort_count}</b>.
    By planting year \u2014 ${fmt(SOURCE.cohorts_by_dob_year)}.
    By Pipeline_Status \u2014 ${fmt(SOURCE.cohorts_by_status)}.
    Crops: ${SOURCE.crops_with_waves} with waves of ${SOURCE.crop_count} in the crop master.
    ${SUMMARY && SUMMARY.by_field_window_eval ? `<br><b>Field-window check</b> \u2014 ${SUMMARY.field_cohorts_evaluated} FIELD cohorts evaluated (${fmt(SUMMARY.by_field_window_eval)}). ${SUMMARY.greenhouse_cohorts_total} GREENHOUSE cohorts excluded (audit total across both: ${SUMMARY.cohorts_total}).`
      : (SUMMARY ? `<br><b>Planting-window check</b> \u2014 ${SUMMARY.cohorts_evaluated} of ${SUMMARY.cohorts_total} cohorts evaluated (${fmt(SUMMARY.by_window_eval)}).` : '')}
    Viewing date is real today; dates in the table below carry their year.
  </div>`;
}

function kpiGroup(label, cols, cells){
  return `<div class="kpi-group"><div class="kpi-group-label">${label}</div><div class="kpi-grid" style="--cols:${cols}">${cells.join('')}</div></div>`;
}

// FIELD rows only (scheduled = COHORTS filtered to isFieldCohort at the dataset boundary),
// evaluated against the field window. Every field wave lands in exactly one bucket, so the
// line always adds up. GH_FULL_EXEMPT no longer exists as a code: GH-FULL is removed from
// this dataset entirely before window evaluation ever runs, so it can't show up here as an
// "exemption" -- it simply isn't a candidate. The only remaining `ghOnly` case is the rare
// anomaly of a field-destination row belonging to a crop with no field window at all.
function windowRecon(scheduled){
  const n = code => scheduled.filter(c => c.window_eval === code).length;
  const r = { total: scheduled.length, inW: n('IN_WINDOW'), out: n('OUTSIDE_WINDOW'),
              ghOnly: n('GREENHOUSE_ONLY'),
              noWin: n('NO_WINDOW'), bad: n('WINDOW_UNPARSEABLE') };
  r.exempt = r.ghOnly;
  r.unchecked = r.noWin + r.bad;                 // a data gap, NOT an exemption
  r.other = r.total - (r.inW + r.out + r.exempt + r.unchecked);
  return r;
}
function reconHTML(k){
  const r = k.recon;
  return `<div class="recon"><b>Field-window check</b> \u2014 ${r.total} FIELD waves:
    <span class="ok">${r.inW} in window</span> \u00b7
    <span class="bad recon-link" data-kpi="outsideWindow">${r.out} outside window</span> \u00b7
    ${r.exempt ? `<span class="recon-link" data-kpi="exemptWindow">\u26a0 ${r.exempt} on a crop with no field window (data anomaly)</span> \u00b7 ` : ''}
    ${r.unchecked ? ` \u00b7 <span class="bad recon-link" data-kpi="uncheckedWindow">${r.unchecked} unchecked \u2014 no usable window data</span>` : ''}
    ${r.other ? ` \u00b7 <span class="bad">${r.other} without an evaluation code</span>` : ''}
    ${k.facilityChecks ? `<br><span class="amb recon-link" data-kpi="facilityCheck">\u26a0 ${k.facilityChecks} wave${k.facilityChecks===1?'':'s'} with a facility / phase conflict</span>` : ''}
    ${k.greenhouseWaves ? `<br><span style="color:var(--text-faint);">${k.greenhouseWaves} greenhouse (GH-FULL) wave${k.greenhouseWaves===1?'':'s'} excluded from this field dashboard \u2014 not counted above, not "exempt"</span>` : ''}
  </div>`;
}

// ============ PRODUCTION MODEL (location vs phase vs propagation) ============
// GH-PROP is a propagation PATH, never a place or a production phase. Three separate facts:
//   Production location = Assigned_Facility (BLK-03, GH-01, GREENHOUSE_HEATED ...)
//   Production phase    = FIELD or GH-FULL, decided by the location
//   Propagation path    = GH-PROP -> FIELD | GH-PROP -> GH, present when a wave has both a sow
//                         and a transplant date
// The backend (ctFacilityInfo_ in ControlTowerAPI.gs) computes all three plus the conflict
// text; the fallbacks below only keep an older deployment working.
function isFieldFacility(f){ return !!f && /^(BLK|B\d|Z\d)/i.test(String(f)); }
function isGhFacility(f){ return !!f && /^(GH|GREENHOUSE)/i.test(String(f)); }
function prodPhase(c){
  if(c.production_phase !== undefined) return c.production_phase;
  if(isFieldFacility(c.facility)) return 'FIELD';
  if(isGhFacility(c.facility)) return 'GH-FULL';
  return c.facility_phase === 'GH-PROP' ? 'FIELD' : (c.facility_phase || null);
}
// THE dataset boundary for the FIELD dashboard. Prefers the backend's own
// production_destination stamp (see ControlTowerAPI.gs ctDestination_); falls
// back to prodPhase() for an older deployment. A GREENHOUSE-destination row
// (GH-FULL, or GH-PROP that never leaves the greenhouse) is not a field row
// and must never reach a field KPI, the pipeline, the calendar, or the
// field-window recon -- it is excluded here, once, before any of those run.
function isFieldCohort(c){
  if(c.production_destination !== undefined) return c.production_destination === 'FIELD';
  return prodPhase(c) !== 'GH-FULL';
}
function propPath(c){
  if(c.propagation_path !== undefined) return c.propagation_path;
  return c.in_gh_prop ? 'GH-PROP \u2192 ' + (prodPhase(c) === 'FIELD' ? 'FIELD' : 'GH') : null;
}
function prodAnomaly(c){
  if(c.facility_conflict !== undefined) return c.facility_conflict;
  if(c.in_gh_prop && isGhFacility(c.facility))
    return 'Facility_Phase is GH-PROP but Assigned_Facility is a greenhouse (' + c.facility + '). Confirm where this wave is produced.';
  if(c.in_gh_prop && c.method === 'DIRECT')
    return 'Direct-sown crop has a sow and transplant date. Confirm Facility_Phase.';
  return null;
}
function prodCellHTML(c){
  const warn = prodAnomaly(c), ph = prodPhase(c), path = propPath(c);
  return `${c.facility || '\u2014'}${ph ? ' \u00b7 ' + ph : ''}` +
    (warn ? ` <span class="prod-flag" title="${warn.replace(/"/g,'&quot;')}">\u26a0</span>` : '') +
    (path ? `<small class="prod-sub">${path}</small>` : '');
}

// Days from a DOB to the nearest allowable-window edge ('MM-DD' segments, wrap-safe).
function windowGap_(dob, segs){
  const d = pd(dob), y = d.getFullYear();
  let best = null;
  (segs || []).forEach(sg => {
    const [sm, sd] = sg.start.split('-').map(Number), [em, ed] = sg.end.split('-').map(Number);
    const wraps = sm > em || (sm === em && sd > ed);
    for(let yy = y - 1; yy <= y + 1; yy++){
      const start = new Date(yy, sm - 1, sd), end = new Date(wraps ? yy + 1 : yy, em - 1, ed);
      let gap, dir;
      if(d < start){ gap = Math.round((start - d) / 864e5); dir = 'before'; }
      else if(d > end){ gap = Math.round((d - end) / 864e5); dir = 'after'; }
      else continue;
      if(!best || gap < best.gap) best = { gap, dir };
    }
  });
  return best;
}
// What CROP_PRODUCTION_MASTER.Greenhouse_Continuity says about the crop behind an off-window wave.
// This reports the crop master; it does not decide routing. undefined = older backend (column hidden).
function ghContinuityNote(crop){
  const g = crop && crop.gh_continuity;
  if(g === undefined) return null;
  if(g === 'YES') return { cls:'amb', short:'yes', txt:'GH continuity YES \u2014 crop can move to greenhouse' };
  if(g === 'REVIEW') return { cls:'amb', short:'review', txt:'GH continuity REVIEW \u2014 routing undecided' };
  return { cls:'bad', short:'no', txt:'GH continuity ' + (g || 'not set') + ' \u2014 planting date must move' };
}
function windowExceptionRows(){
  return COHORTS.filter(c => c.dob && isFieldCohort(c) && c.window_check === 'OUTSIDE WINDOW').sort((a,b) => a.dob < b.dob ? -1 : a.dob > b.dob ? 1 : 0);
}

function kpiCell(n, label, cls, key, sub){
  return `<div class="kpi ${cls||''}" data-kpi="${key}"><div class="n">${n}</div><div class="l">${label}</div>${sub?`<div class="l" style="opacity:.7;font-size:11px;">${sub}</div>`:''}</div>`;
}

// Drill-down: which cohorts/crops make up a given KPI number, as of the
// current viewing date. Mirrors computeKPIs()'s own filters exactly so the
// list always matches the count shown on the tile.
function kpiDrilldown_(key, asOf){
  const scheduled = COHORTS.filter(c=>c.dob && isFieldCohort(c)); // dataset boundary: field-only
  switch(key){
    case 'activeCrops':
      return { type:'crops', title:'Active Crops',
        items: Array.from(new Set(scheduled.map(c=>c.crop_id))).map(id=>cropById[id]).filter(Boolean) };
    case 'totalCohorts':
      return { type:'cohorts', title:'Active Cohorts / Waves', items: scheduled };
    case 'fieldCohorts':
      return { type:'cohorts', title:'Field Production \u2014 direct in a field block', items: scheduled.filter(c=>prodPhase(c)==='FIELD' && !propPath(c)) };
    case 'ghCohorts':
      return { type:'cohorts', title:'Field Production \u2014 via GH-PROP (propagated in greenhouse, transplanted to a field block)', items: scheduled.filter(c=>prodPhase(c)==='FIELD' && propPath(c)) };
    case 'alertCrops':
      return { type:'crops', title:'Crops With Alerts', items: alertCropIds(computeAlerts()).map(id=>cropById[id]).filter(Boolean) };
    case 'exemptWindow':
      return { type:'cohorts', title:'Field Waves on a Crop With No Field Window (Data Anomaly)', items: scheduled.filter(c=>c.window_eval==='GREENHOUSE_ONLY') };
    case 'uncheckedWindow':
      return { type:'cohorts', title:'Waves Unchecked \u2014 No Usable Window Data', items: scheduled.filter(c=>c.window_eval==='NO_WINDOW' || c.window_eval==='WINDOW_UNPARSEABLE') };
    case 'facilityCheck':
      return { type:'cohorts', title:'Waves With a Facility / Phase Conflict', items: scheduled.filter(c=>prodAnomaly(c)) };
    case 'startsOverdue':
      return { type:'cohorts', title:'Planned \u00b7 Start Date Passed (still PLANNED, not dispatched)', items: scheduled.filter(c=>startOverdue(c, asOf)) };
    case 'noWaves':
      return { type:'crops', title:'Crops Without Scheduled Waves', items: CROPS.filter(c=>c.valid_waves===0) };
    case 'harvestingNow':
      return { type:'cohorts', title:'Harvesting Now', items: scheduled.filter(c=>getStage(c,asOf)==='harvesting') };
    case 'ready7':
      return { type:'cohorts', title:'Harvest Ready ≤ 7 Days',
        items: scheduled.filter(c=>c.harvest_ready && c.harvest_ready>asOf && daysBetween(asOf,c.harvest_ready)<=7) };
    case 'ready14':
      return { type:'cohorts', title:'Harvest Ready 8–14 Days',
        items: scheduled.filter(c=>c.harvest_ready && daysBetween(asOf,c.harvest_ready)>7 && daysBetween(asOf,c.harvest_ready)<=14) };
    case 'outsideWindow':
      return { type:'cohorts', title:'Waves Outside Window', items: scheduled.filter(c=>c.window_check==='OUTSIDE WINDOW') };
    case 'missingWindow':
      return { type:'crops', title:'Crops Missing Window Data', items: CROPS.filter(c=>c.window_kind==='NONE' || c.window_kind==='UNPARSEABLE') };
    default:
      return null;
  }
}

        <tbody>

// Days column = time to FIRST harvest while a wave is growing/planned; once harvest has started it says
// so and shows how long the harvest window has left (it never says 'past' next to a Harvesting status).
function harvestTimingCell(r, asOf){
  if(r.stage === 'harvesting') return `<small>harvesting \u00b7 ${daysBetween(asOf, r.harvest_end)}d left</small>`;
  if(r.stage === 'complete') return '<small>harvest done</small>';

function renderPipelineTable(){
  const asOf = state.asOf;
  // Next Wave DOB = the same crop's next planting date after this wave's DOB (blank for its last wave).
  const dobsByCrop = {};
  COHORTS.forEach(c => { if(c.dob && isFieldCohort(c)) (dobsByCrop[c.crop_id] = dobsByCrop[c.crop_id] || []).push(c.dob); }); // dataset boundary: field-only
  Object.keys(dobsByCrop).forEach(k => dobsByCrop[k].sort());
  let rows = COHORTS.filter(c => c.dob && isFieldCohort(c)).map(c => ({...c, next_dob: (dobsByCrop[c.crop_id].find(d => d > c.dob) || null), harvest_end_from_sheet: !!c.harvest_end, stage: getStage(c, asOf), daysToHarvest: c.harvest_ready ? daysBetween(asOf, c.harvest_ready) : null, harvest_end: harvestEndFor(c) }));
  // CURRENT pipeline = what is physically in production or about to start as of the viewing date:
  //   harvesting + growing (always), planned waves whose start is inside the horizon (this includes any
  //   start date that has already passed), and waves that finished harvesting within the last 14 days.
  // Everything later is in the Planting Calendar tab, not here.
  const totalWaves = rows.length;
  const horizonEnd = state.horizon === null ? null : addDays(asOf, state.horizon);
  rows = rows.filter(r => {
    if(r.stage === 'harvesting' || r.stage === 'growing') return true;
    if(r.stage === 'complete') return r.harvest_end && daysBetween(r.harvest_end, asOf) <= 14;
    return horizonEnd === null || r.dob <= horizonEnd;             // planned
  });
  const nHarv = rows.filter(r => r.stage === 'harvesting').length, nGrow = rows.filter(r => r.stage === 'growing').length;
  const nPlan = rows.filter(r => r.stage === 'planned').length;
  const subEl = document.getElementById('pipelineSub');
  if(subEl) subEl.textContent = `${rows.length} of ${totalWaves} waves \u00b7 ${nHarv} harvesting \u00b7 ${nGrow} growing \u00b7 ${nPlan} planned` + (state.horizon === null ? '' : ` (next ${state.horizon} days)`) + ' \u00b7 click a header to sort, a row for detail';
  const sortKey = state.sortCol, dir = state.sortDir;
  rows.sort((a,b) => {
    let av = a[sortKey], bv = b[sortKey];
    if(av===null||av===undefined) av = '';
    if(bv===null||bv===undefined) bv = '';
    if(av<bv) return -1*dir; if(av>bv) return 1*dir; return 0;
  });

  const cols = [
    ['crop','Crop'], ['wave','Wave'], ['dob','DOB'], ['method','Method'], ['facility','Production'],
    ['harvest_ready','Harvest Ready'], ['harvest_end','Harvest Ends'], ['next_dob','Next Wave DOB'], ['daysToHarvest','Days to Harvest'], ['stage','Stage'], ['pipeline_status','Pipeline Status']
  ];
  document.getElementById('pipelineTableWrap').innerHTML = `
    <div style="max-height:420px; overflow:auto;">
    <table>
      <thead><tr>${cols.map(([k,l])=>`<th data-col="${k}">${l}${state.sortCol===k?(state.sortDir===1?' ▲':' ▼'):''}</th>`).join('')}</tr></thead>
      <tbody>
        ${rows.map(r => `
          <tr class="rowlink" data-key="${r.key}">
            <td>${r.crop}</td>
            <td class="mono">${r.crop_id}-W${r.wave}</td>
            <td class="mono">${fmtShortY(r.dob)}</td>
            <td>${methodBadge(r.method)}</td>
            <td class="mono">${prodCellHTML(r)}</td>
            <td class="mono">${fmtShortY(r.harvest_ready)}</td>
            <td class="mono">${fmtShortY(r.harvest_end)} <small>(${r.harvest_ready && r.harvest_end ? daysBetween(r.harvest_ready, r.harvest_end) : harvestWindowFor(r)}d${(!r.harvest_end_from_sheet && harvestWindowIsDefault(r))?' default':''})</small></td>
            <td class="mono">${fmtShortY(r.next_dob)}</td>
            <td class="mono">${harvestTimingCell(r, asOf)}</td>
            <td>${stageBadge(r.stage)}${startOverdue(r, asOf) ? '<small class="prod-sub" style="color:var(--amber)">start date passed \u00b7 still PLANNED</small>' : ''}</td>
            <td class="mono"><small>${r.pipeline_status || '—'}</small></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    </div>
  `;
  document.querySelectorAll('#pipelineTableWrap th').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if(state.sortCol === col) state.sortDir *= -1; else { state.sortCol = col; state.sortDir = 1; }
      renderPipelineTable();
    });
  });
  el_delegate(document.getElementById('pipelineTableWrap'), 'tr.rowlink', el => openCohortModal(el.dataset.key));
}

// Three separate concerns, never mixed: a planting-rule violation (wave level),
// a coverage shortfall (crop level), and a crop with no production plan at all.
function alertsGroupedHTML(alerts, includeData){
  const all = [...alerts.critical, ...alerts.warning, ...alerts.info];
  const cov = all.filter(a => a.kind === 'coverage');
  const noplan = all.filter(a => a.kind === 'noplan');
  const data = all.filter(a => a.kind === 'data');
  const exc = windowExceptionRows();
  const excCrops = new Set(exc.map(c => c.crop_id)).size;

  const notes = exc.map(c => ghContinuityNote(cropById[c.crop_id]));
  const hasNotes = notes.length > 0 && notes.every(n => n);
  const nYes = notes.filter(n => n && n.short === 'yes').length, nRev = notes.filter(n => n && n.short === 'review').length, nNo = notes.filter(n => n && n.short === 'no').length;
  const excSplit = hasNotes && exc.length
    ? ` ${nYes} on crops that can move to greenhouse \u00b7 ${nRev} routing undecided \u00b7 ${nNo} on crops with no greenhouse continuity (date must change).` : '';

  const excTable = exc.length ? `<div class="exc-wrap"><table class="exc-table">
      <thead><tr><th>Wave</th><th>Crop</th><th>DOB</th><th>Production</th><th>Allowable window</th><th>Exception</th>${hasNotes ? '<th>Crop master</th>' : ''}</tr></thead>
      <tbody>${exc.map((c, i) => {
        const crop = cropById[c.crop_id] || {};
        const g = windowGap_(c.dob, crop.window_segments);
        const gapTxt = g ? `${g.gap} day${g.gap===1?'':'s'} ${g.dir==='before' ? 'before window opens' : 'after window closes'}` : 'outside window';
        return `<tr class="rowlink exc-row" data-key="${c.key}">
          <td class="mono">${c.crop_id}-W${c.wave}</td>
          <td>${c.crop}</td>
          <td class="mono">${fmtShortY(c.dob)}</td>
          <td class="mono">${prodCellHTML(c)}</td>
          <td class="mono"><small>${fmtWindowSegments(crop.window_segments)}</small></td>
          <td class="exc">${gapTxt}</td>
          ${hasNotes ? `<td><small class="${notes[i].cls==='bad' ? 'recon-bad' : ''}" style="color:var(--${notes[i].cls==='bad' ? 'red' : 'amber'})">${notes[i].txt}</small></td>` : ''}
        </tr>`;
      }).join('')}</tbody></table></div>` : `<div class="empty">None.</div>`;

  const noplanTable = noplan.length ? `<div class="exc-wrap"><table>
      <thead><tr><th>Crop</th><th>Status</th><th>Detail</th></tr></thead>
      <tbody>${noplan.map(a => {
        const crop = cropById[a.crop] || {};
        return `<tr class="rowlink noplan-row" data-crop="${a.crop}"><td>${crop.crop || a.crop}</td><td class="mono">${crop.data_status || '\u2014'}</td><td><small>No COHORT_PRODUCTION row with a Transplant_Date or Sow_Date</small></td></tr>`;
      }).join('')}</tbody></table></div>` : `<div class="empty">None.</div>`;

  return `
    <div class="alert-group">
      <h3 style="color:var(--red)">WINDOW EXCEPTIONS \u00b7 ${exc.length} wave${exc.length===1?'':'s'} in ${excCrops} crop${excCrops===1?'':'s'}</h3>
      <div class="alert-section-sub">Waves planted outside the crop's allowable field window \u2014 click a row for the wave.${excSplit}</div>
      ${excTable}
    </div>
    <div class="alert-group">
      <h3 style="color:var(--amber)">COVERAGE / WAVE COUNT \u00b7 ${cov.length} crop${cov.length===1?'':'s'} below minimum</h3>
      <div class="alert-list">${cov.length ? cov.map(alertItemHTML).join('') : '<div class="empty">None.</div>'}</div>
    </div>
    <div class="alert-group">
      <h3 style="color:var(--blue)">CROPS WITHOUT SCHEDULED WAVES \u00b7 ${noplan.length}</h3>
      ${noplanTable}
    </div>
    ${includeData && data.length ? `<div class="alert-group">
      <h3 style="color:var(--text-dim)">NEEDS DATA \u00b7 ${data.length}</h3>
      <div class="alert-list">${data.map(alertItemHTML).join('')}</div>
    </div>` : ''}`;
}

  el_delegate(container, '.alert-item', el => { if(el.dataset.crop) openCropDetail(el.dataset.crop); });
  el_delegate(container, 'tr.exc-row', el => openCohortModal(el.dataset.key));
  el_delegate(container, 'tr.noplan-row', el => openCropDetail(el.dataset.crop));

function methodBadge(m){
  const cls = m==='DIRECT' ? 'method-direct' : 'method-other';
  return `<span class="badge ${cls}">${m}</span>`;
}
function stageBadge(s){
  const map = { planned:'stage-planned', ghprop:'stage-ghprop', growing:'stage-growing', harvesting:'stage-harvesting', complete:'stage-complete', 'no-schedule':'stage-planned' };
  return `<span class="badge ${map[s]||''}">${STAGE_LABEL[s]||s}</span>`;
}
// w = window_check ('IN WINDOW' | 'OUTSIDE WINDOW' | null); ev = window_eval (why it is null)
function windowBadge(w, ev){
  if(w==='IN WINDOW') return `<span class="badge win-in">IN WINDOW</span>`;
  if(w==='OUTSIDE WINDOW') return `<span class="badge win-out">OUTSIDE</span>`;
  if(ev==='GREENHOUSE') return `<span class="badge win-none" title="Greenhouse-destination wave \u2014 not part of the field dataset, not field-window checked">GREENHOUSE</span>`;
  if(ev==='GREENHOUSE_ONLY') return `<span class="badge win-none" title="Greenhouse-only crop \u2014 no field window">GH ONLY</span>`;
  if(ev==='WINDOW_UNPARSEABLE') return `<span class="badge win-out" title="Window text could not be read">CHECK WINDOW</span>`;
  if(ev==='NO_WINDOW') return `<span class="badge win-none">NO WINDOW</span>`;
  return `<span class="badge win-none">—</span>`;
}
function cropWindowBadge(c){
  if(c.window_kind==='FIELD') return windowBadge(c.outside_window_waves>0 ? 'OUTSIDE WINDOW' : 'IN WINDOW');
  if(c.window_kind==='GREENHOUSE_ONLY') return windowBadge(null,'GREENHOUSE_ONLY');
  if(c.window_kind==='UNPARSEABLE') return windowBadge(null,'WINDOW_UNPARSEABLE');
  return windowBadge(null,'NO_WINDOW');
}

function el_delegate(container, selector, fn){
  container.querySelectorAll(selector).forEach(el => el.addEventListener('click', () => fn(el)));
}

// ============ ALERTS COMPUTATION ============
function computeAlerts(){
  // `level` (critical/warning/info) drives the alert-crop count; `kind` drives how the
  // alerts are grouped on screen: window | coverage | noplan | data.
  const critical = [], warning = [], info = [];
  CROPS.forEach(crop => {
    if(crop.window_kind === 'GREENHOUSE_ONLY') return; // no field wave is expected here -- not a field-dashboard concern
    if(crop.valid_waves === 0){
      warning.push({ kind:'noplan', title: `${crop.crop}: no scheduled waves`, detail: `No COHORT_PRODUCTION row with a Transplant_Date or Sow_Date \u00b7 Status: ${crop.data_status}`, crop: crop.crop_id, level:'warning' });
    } else if(crop.has_window && crop.valid_waves < crop.min_waves){
      critical.push({ kind:'coverage', title: `${crop.crop} has fewer than ${crop.min_waves} scheduled waves`, detail: `${crop.valid_waves} of ${crop.min_waves} minimum waves scheduled`, crop: crop.crop_id, level:'critical' });
    }
    if(crop.outside_window_waves > 0){
      warning.push({ kind:'window', title: `${crop.crop}: ${crop.outside_window_waves} wave${crop.outside_window_waves>1?'s':''} scheduled outside the allowable planting window`, detail: `Window: ${crop.window_label}`, crop: crop.crop_id, level:'warning' });
    }
    if(crop.window_kind==='NONE'){
      info.push({ kind:'data', title: `${crop.crop}: no planting window on record`, detail: `Status: ${crop.data_status} \u2014 its waves cannot be window-checked`, crop: crop.crop_id, level:'info' });
    } else if(crop.window_kind==='UNPARSEABLE'){
      info.push({ kind:'data', title: `${crop.crop}: planting window could not be read`, detail: `CROP_LIFECYCLE says "${crop.window_label}" \u2014 fix the text so waves can be checked`, crop: crop.crop_id, level:'info' });
    }
  });
  return { critical, warning, info };
}
// Distinct crops behind the critical + warning items (one crop can raise several items)
function alertCropIds(a){ return Array.from(new Set([...a.critical, ...a.warning].map(x=>x.crop))); }

function alertItemHTML(a){
  return `<div class="alert-item ${a.level}" data-crop="${a.crop}">
    <div class="title">${a.title}</div>
    <div class="detail">${a.detail}</div>
  </div>`;
}

function renderAlertsView(){
  const el = document.getElementById('view-alerts');
  const a = computeAlerts();
  el.innerHTML = `<div class="panel">${alertsGroupedHTML(a, true)}</div>`;
  wireAlertClicks(el);
  document.getElementById('alertNavCount').textContent = alertCropIds(a).length || '';
}

}

function shiftMonth(delta){
  state.calMonth += delta;
  if(state.calMonth < 0){ state.calMonth = 11; state.calYear--; }
  if(state.calMonth > 11){ state.calMonth = 0; state.calYear++; }
  renderCalGrid();
}

function renderCalGrid(){
  document.getElementById('calMonthLabel').textContent = MONTHS[state.calMonth] + ' ' + state.calYear;
  const first = new Date(state.calYear, state.calMonth, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(state.calYear, state.calMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(state.calYear, state.calMonth, 0).getDate();
  const today = todayISO();

  const cells = [];
  for(let i=0;i<startOffset;i++){
    const dnum = daysInPrevMonth - startOffset + 1 + i;
    cells.push({ dnum, otherMonth:true, iso: null });
  }
  for(let d=1; d<=daysInMonth; d++){
    const iso = state.calYear+'-'+String(state.calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    cells.push({ dnum:d, otherMonth:false, iso });
  }
  while(cells.length % 7 !== 0){
    cells.push({ dnum: cells.length - startOffset - daysInMonth + 1, otherMonth:true, iso:null });
  }

  const html = `
    <div class="cal-grid">
      ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(c => {
        if(c.otherMonth) return `<div class="cal-cell other-month"><div class="cal-daynum">${c.dnum}</div></div>`;
        const dayEvents = (eventsByDate[c.iso]||[]).filter(e => state.filters[e.type]);
        const isToday = c.iso === today;
        const shown = dayEvents.slice(0,4);
        const extra = dayEvents.length - shown.length;
        return `<div class="cal-cell ${isToday?'today':''}" data-iso="${c.iso}">
          <div class="cal-daynum">${c.dnum}</div>
          ${shown.map(e => `<div class="cal-event ${e.type} ${e.sub}" data-key="${e.cohort.key}" title="${e.cohort.crop} — Wave ${e.cohort.wave}">${eventIcon(e)} ${e.cohort.crop_id} W${e.cohort.wave}</div>`).join('')}
          ${extra>0?`<div class="cal-more">+${extra} more</div>`:''}
        </div>`;
      }).join('')}
    </div>
  `;
  document.getElementById('calGridWrap').innerHTML = html;
  el_delegate(document.getElementById('calGridWrap'), '.cal-event', el => openCohortModal(el.dataset.key));
}

function eventIcon(e){
  if(e.type === 'plant') return e.sub==='ghprop' ? '🌿' : '🌱';
  if(e.type === 'transplant') return '🚜';
  if(e.type === 'harvest') return '🧺';
  return '•';
}

function nextEventAfter(rows, field, asOf){
  const dates = rows.map(r=>r[field]).filter(Boolean).filter(d => d >= asOf).sort();
  return dates[0] || null;
}

function renderCropMiniTimeline(rows, spanStart, totalSpan){
  const withDob = rows.filter(r=>r.dob);
  if(!withDob.length){ document.getElementById('cropTimelineWrap').innerHTML = ''; return; }
  const spanStartISO = toISO(spanStart);
  document.getElementById('cropTimelineWrap').innerHTML = withDob.map(r => {
    const barStart = daysBetween(spanStartISO, r.dob);
    let segments = '';
    if(r.harvest_ready){
      const fieldLen = daysBetween(r.dob, r.harvest_ready);
      segments += `<div class="timeline-bar field" style="left:${pct(barStart,totalSpan)}%; width:${pct(fieldLen,totalSpan)}%;"></div>`;
    }
    const dotPos = r.harvest_ready ? daysBetween(spanStartISO, r.harvest_ready) : barStart;
    segments += `<div class="timeline-dot" style="left:${pct(dotPos,totalSpan)}%;"></div>`;
    return `<div class="timeline-row">
      <div class="timeline-label">W${r.wave}</div>
      <div class="timeline-track">${segments}</div>
    </div>`;
  }).join('');
}
function pct(v, total){ return Math.max(0, Math.min(100, (v/total)*100)); }

// Writes a new DOB back to COHORT_PRODUCTION via the backend, then merges the
// engine's freshly recomputed cohort + crop summary into local state and
// re-renders both the modal (in place) and whichever tab is behind it.
async function saveDob_(key, newDob){
  const c = cohortByKey[key];
  if(!c) return;
  const statusEl = document.getElementById('dobEditStatus');
  const saveBtn = document.getElementById('dobSaveBtn');
  const clearBtn = document.getElementById('dobClearBtn');
  saveBtn.disabled = true; clearBtn.disabled = true;
  statusEl.className = 'status'; statusEl.textContent = 'saving…';
  try{
    const result = await api('update-control-tower-dob', { crop_id: c.crop_id, wave: c.wave, cohort_id: c.cohort_id, dob: newDob || null });
    // merge the updated cohort(s) for this crop back into local arrays
    (result.cohorts || [result.cohort]).forEach(updated => {
      if(!updated) return;
      const idx = COHORTS.findIndex(x => x.crop_id === updated.crop_id && x.wave === updated.wave);
      if(idx >= 0) COHORTS[idx] = updated; else COHORTS.push(updated);
    });
    if(result.summary) SUMMARY = result.summary;
    if(result.crop){
      const cIdx = CROPS.findIndex(x => x.crop_id === result.crop.crop_id);
      if(cIdx >= 0) CROPS[cIdx] = result.crop; else CROPS.push(result.crop);
    }
    indexData();
    indexEvents();
    renderAll();
    openCohortModal(key); // reopen with fresh computed values
    const freshStatus = document.getElementById('dobEditStatus');
    if(freshStatus){ freshStatus.className = 'status ok'; freshStatus.textContent = 'saved ✓'; }
  } catch(err){
    statusEl.className = 'status err'; statusEl.textContent = err.message || 'save failed';
    saveBtn.disabled = false; clearBtn.disabled = false;
  }
}

// Shows which workbook actually answered. If the response has no `source`
// stamp, the URL above is serving code that predates it -- i.e. NOT the
// current ControlTowerAPI.gs -- which is the "wrong/old data" symptom.
function reportSource(data){
  const label = document.getElementById('syncStatusText');
  const src = data && data.source;
  if(!src){
    showBackendWarning('This URL is not running the current Control Tower backend (no workbook stamp in its response). It is an old deployment, an old script version, or a different project. Check APPS_SCRIPT_URL and redeploy as a NEW VERSION.');
    return;
  }
  document.getElementById('syncStatus').title = 'Workbook ID: ' + src.workbook_id + '\nCohorts: ' + src.cohort_count + ' · Crops: ' + src.crop_count;
  const missing = Object.keys(src.tabs_present).filter(k => !src.tabs_present[k]);
  if(missing.length){
    showBackendWarning('Connected to workbook "' + src.workbook_name + '", which is missing: ' + missing.join(', ') + '. This is not Ranch_Vegetable_VPOS_MASTER_v2026.');
  } else if(!/VPOS_MASTER/i.test(src.workbook_name)){
    showBackendWarning('Connected to workbook "' + src.workbook_name + '" -- expected Ranch_Vegetable_VPOS_MASTER_v2026.');
  }
  label.textContent += ' · ' + src.workbook_name;
}
function showBackendWarning(msg){
  document.getElementById('errorBannerText').textContent = msg;
  document.getElementById('errorBanner').classList.add('show');
}

function applyDataset(data){
  SOURCE = data.source || null;
  SUMMARY = data.summary || null;
  COHORTS = data.cohorts;
  CROPS = data.crops;
  indexData();
  indexEvents();
  const earliestDob = COHORTS.filter(c=>c.dob).map(c=>c.dob).sort()[0];
  SEASON_START = earliestDob || todayISO();
}

// Initial page load: fetch everything from the Sheet before rendering anything.
async function boot(){
  const overlay = document.getElementById('loadingOverlay');
  overlay.style.display = 'flex';
  hideError();
  try{
    const data = await api('get-control-tower-data');
    applyDataset(data);
    const isFirstLoad = !document.getElementById('view-dashboard').dataset.booted;
    if(isFirstLoad){
      // Open on the real today, NOT the earliest DOB in the data. VPOS holds
      // rows that start in Oct 2025, so defaulting to SEASON_START opened the
      // tower a year in the past (every "today" panel read 0). The "Season
      // start" button still jumps there on demand.
      state.asOf = todayISO();
      state.calYear = pd(state.asOf).getFullYear();
      state.calMonth = pd(state.asOf).getMonth();
      initHeader();
      document.getElementById('view-dashboard').dataset.booted = '1';
    }
    setSyncStatus('ok', 'synced ' + new Date().toLocaleTimeString());
    reportSource(data);
    renderAll();
  } catch(err){
    showError(err.message || String(err));
    setSyncStatus('stale', 'not connected');
  } finally {
    overlay.style.display = 'none';
  }
}

// Re-pulls the Sheet (e.g. after someone edits it directly, or after a save)
// without disturbing the current tab / as-of date the person is looking at.
async function refreshData(){
  const btn = document.getElementById('syncBtn');
  btn.classList.add('syncing');
  hideError();
  try{
    const data = await api('get-control-tower-data');
    applyDataset(data);
    setSyncStatus('ok', 'synced ' + new Date().toLocaleTimeString());
    reportSource(data);
    renderAll();
  } catch(err){
    showError(err.message || String(err));
    setSyncStatus('stale', 'sync failed');
  } finally {
    btn.classList.remove('syncing');
  }
}

boot();

</script>
